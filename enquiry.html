<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enquiry | Shani Traders</title>
<meta name="description" content="Send your building material list to Shani Traders and get a confirmed rate.">
<meta name="theme-color" content="#1E252B">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="enquiry" data-title="title.enquiry">
<div id="site-header"></div>
<main id="main">
<section class="page-head"><div class="wrap">
  <h1 data-t="e.title">Your enquiry</h1><p data-t="e.sub"></p>
</div></section>
<div class="wrap enq">
  <section class="panel" aria-labelledby="l-title">
    <div class="section-head" style="margin-bottom:8px"><h2 id="l-title" style="margin:0" data-t="e.items"></h2><button class="btn btn-ghost btn-sm" id="clear" hidden data-t="e.clear"></button></div>
    <ul class="items" id="items"></ul>
    <div id="list-acts" style="margin-top:14px"></div>
  </section>
  <section class="panel" aria-labelledby="f-title" id="form-panel">
    <h2 id="f-title" data-t="e.details"></h2>
    <div id="fmsg"></div>
    <form id="f" novalidate>
      <div class="field"><label for="name" data-t="e.name"></label><input id="name" name="name" required autocomplete="name" maxlength="80"></div>
      <div class="field"><label for="phone" data-t="e.phone"></label><input id="phone" name="phone" required inputmode="numeric" autocomplete="tel" maxlength="14" data-t-ph="e.phonePh"></div>
      <div class="row2">
        <div class="field"><label for="place" data-t="e.place"></label><input id="place" name="place" maxlength="80"></div>
        <div class="field"><label for="delivery" data-t="e.delivery"></label>
          <select id="delivery" name="delivery"><option value="Deliver to my site" data-t="e.d1"></option><option value="Pick up from shop" data-t="e.d2"></option><option value="Not decided yet" data-t="e.d3"></option></select></div>
      </div>
      <div class="field"><label for="email"><span data-t="e.email"></span> <span class="muted" data-t="e.optional"></span></label><input id="email" name="email" type="email" autocomplete="email" maxlength="120"><span class="hint" data-t="e.emailHint"></span></div>
      <div class="field"><label for="message" data-t="e.msg"></label><textarea id="message" name="message" maxlength="1500" data-t-ph="e.msgPh"></textarea></div>
      <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="btn btn-dark btn-block" id="send" data-t="e.send"></button>
    </form>
  </section>
</div>
</main>
<div id="site-footer"></div>
<script src="config.js"></script>
<script src="lang.js"></script>
<script src="app.js"></script>
<script>
(() => {
  const { $, esc, List, listText, waLink, api, svg, S, t, shopName, unitT, HI } = ST;
  const nm = x => (HI && x.nameHi) ? x.nameHi : x.name;
  function renderList() {
    const a = List.get();
    $('#clear').hidden = !a.length;
    $('#items').innerHTML = a.length ? a.map(x => `<li data-id="${esc(x.id)}">
      <span class="nm">${esc(nm(x))}<small>${esc(x.brand || '')}${x.brand ? ', ' : ''}${esc(t('card.per', { unit: unitT(x.unit) }))}</small></span>
      <span class="qty"><button type="button" data-step="-1" aria-label="${esc(t('pd.less'))}">−</button><input type="number" min="1" value="${Number(x.qty)}" aria-label="${esc(t('pd.qty', { unit: unitT(x.unit) }))}"><button type="button" data-step="1" aria-label="${esc(t('pd.more'))}">+</button></span>
      <button class="rm" type="button">${esc(t('e.remove'))}</button></li>`).join('')
      : `<li style="display:block"><p class="muted" style="margin:0">${esc(t('e.empty'))}</p></li>`;
    $('#list-acts').innerHTML = a.length
      ? `<a class="btn btn-wa btn-block" target="_blank" rel="noopener" href="${waLink(t('e.waMsg', { shop: shopName(), list: listText(a) }))}">${svg('wa')}${esc(t('e.sendWa'))}</a>`
      : `<div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn btn-ghost" href="products.html">${esc(t('e.browse'))}</a><a class="btn btn-ghost" href="calculator.html">${esc(t('nav.calc'))}</a></div>`;
  }
  $('#items').addEventListener('click', e => {
    const li = e.target.closest('li[data-id]'); if (!li) return;
    if (e.target.closest('.rm')) return List.remove(li.dataset.id);
    const b = e.target.closest('[data-step]');
    if (b) { const i = li.querySelector('input'); List.setQty(li.dataset.id, (parseInt(i.value, 10) || 1) + Number(b.dataset.step)); }
  });
  $('#items').addEventListener('change', e => { const li = e.target.closest('li[data-id]'); if (li && e.target.matches('input')) List.setQty(li.dataset.id, parseInt(e.target.value, 10) || 1); });
  $('#clear').addEventListener('click', () => { if (confirm(t('e.clearQ'))) List.clear(); });
  document.addEventListener('list:change', renderList);
  renderList();

  const f = $('#f'), msg = $('#fmsg'), btn = $('#send');
  const show = (h, cls) => { msg.innerHTML = h ? `<p class="msg ${cls}">${h}</p>` : ''; };
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(f));
    const phone = String(d.phone).replace(/\D/g, '').slice(-10);
    const items = List.get();
    if (!d.name.trim()) { show(esc(t('e.errName')), 'err'); return $('#name').focus(); }
    if (phone.length !== 10) { show(esc(t('e.errPhone')), 'err'); return $('#phone').focus(); }
    if (!items.length && !d.message.trim()) { show(esc(t('e.errEmpty')), 'err'); return $('#message').focus(); }
    const text = listText(items);
    const delivery = $('#delivery').selectedOptions[0].textContent;
    if (!S.apiUrl) { window.open(waLink(t('e.waForm', { shop: shopName(), name: d.name, phone, place: d.place, delivery, list: text, msg: d.message })), '_blank'); return; }
    btn.disabled = true; btn.textContent = t('e.sending'); show('');
    try {
      const r = await api({ action: 'enquiry', name: d.name, phone, email: d.email, place: d.place, delivery: d.delivery, message: d.message, items: text, website: d.website, source: 'Website form (' + ST.lang + ')' });
      List.clear(); f.reset();
      $('#form-panel').innerHTML = `<div class="done"><h2>${esc(t('e.done'))}</h2><p>${esc(t('e.doneMsg', { id: r.enquiryId, phone }))}${d.email ? esc(t('e.doneMail')) : ''}</p><a class="btn btn-dark" href="products.html">${esc(t('e.back'))}</a></div>`;
    } catch (err) {
      const link = `<a href="${waLink(t('e.waMsg', { shop: shopName(), list: text + '\n' + d.message }))}" target="_blank" rel="noopener">${esc(t('e.errLink'))}</a>`;
      show(esc(err.message) + ' ' + esc(t('e.errAlt')).replace('{link}', link), 'err');
      btn.disabled = false; btn.textContent = t('e.send');
    }
  });
})();
</script>
</body>
</html>
